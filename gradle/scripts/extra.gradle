// You may write any gradle buildscript component in this file
// This file is automatically applied after build.gradle + dependencies.gradle is ran

// If you wish to use the default helper methods, uncomment the line below
// apply from: 'gradle/scripts/helpers.gradle'

apply plugin: 'com.diffplug.spotless'

spotless {
    enforceCheck false

    java {
        target fileTree('src') {
            include "*/java/**/*.java"
        }

        leadingTabsToSpaces()
        endWithNewline()
        removeUnusedImports()
    }
}

// SRP 1.10.9 is a coremod + mod. FML's dev command-line coremod path does not
// register the contained mod, so place the dev-remapped jar in run/mods too.
tasks.register('copySrpModForDev', Copy) {
    from(configurations.mcpCompileModClasspath.filter { it.name.startsWith('scape-and-run-parasites-') })
    into file('run/mods')
}

tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
    dependsOn 'copySrpModForDev'
}
